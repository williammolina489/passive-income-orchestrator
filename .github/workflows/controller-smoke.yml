name: Controller API Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/controller-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run bounded OpenAI controller dry run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
          ORCHESTRATOR_MODEL: gpt-5.6-luna
        run: |
          orchestrator-decide | tee controller-decision.json

      - name: Upload dry-run decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-dry-run
          path: controller-decision.json
          if-no-files-found: ignore
