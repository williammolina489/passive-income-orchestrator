name: E002 Finite Checkpoints

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: crypto-funding-e002-finite-sequence
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out orchestrator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install orchestrator
        run: python -m pip install -e ".[dev]"

      - name: Archived sequence guard
        id: determine
        run: |
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "E002 is stopped and no checkpoint execution is authorized."

      - name: Fail-closed sequence preflight
        if: steps.determine.outputs.skip != 'true'
        id: preflight
        env:
          CHECKPOINT: ${{ steps.determine.outputs.checkpoint }}
        run: |
          python -m controller.e002_schedule preflight "$CHECKPOINT" \
            --root . \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify authorized crypto branch has not moved
        if: steps.preflight.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
          TARGET_REPO: ${{ steps.preflight.outputs.repository }}
          TARGET_BRANCH: ${{ steps.preflight.outputs.branch }}
          EXPECTED_SHA: ${{ steps.preflight.outputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(gh api "repos/$TARGET_REPO/branches/$TARGET_BRANCH" --jq '.commit.sha')"
          echo "Expected: $EXPECTED_SHA"
          echo "Actual:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Authorized E002 branch moved; refusing to collect evidence."
            exit 1
          fi

      - name: Check out exact authorized E002 implementation
        if: steps.preflight.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.preflight.outputs.repository }}
          ref: ${{ steps.preflight.outputs.expected_sha }}
          path: target
          token: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
          persist-credentials: false

      - name: Install read-only E002 runtime
        if: steps.preflight.outputs.run == 'true'
        run: python -m pip install -e "target[live]"

      - name: Run one authorized read-only checkpoint
        if: steps.preflight.outputs.run == 'true'
        id: execute
        env:
          CHECKPOINT: ${{ steps.determine.outputs.checkpoint }}
        shell: bash
        run: |
          set +e
          python target/scripts/e002_validate.py --checkpoint "$CHECKPOINT" \
            > e002-checkpoint.log 2>&1
          RC=$?
          set -e
          cat e002-checkpoint.log
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"

      - name: Record bounded checkpoint evidence
        if: steps.preflight.outputs.run == 'true'
        env:
          CHECKPOINT: ${{ steps.determine.outputs.checkpoint }}
          EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m controller.e002_schedule record \
            "$CHECKPOINT" e002-checkpoint.log \
            --exit-code "$EXIT_CODE" \
            --root . \
            --run-url "$RUN_URL"

      - name: Refresh central portfolio status
        if: steps.preflight.outputs.run == 'true'
        run: |
          orchestrator-portfolio
          cat PORTFOLIO_STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit checkpoint state and evidence
        if: steps.preflight.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state observations PORTFOLIO_STATUS.md
          if git diff --cached --quiet; then
            echo "No checkpoint state changes to commit."
            exit 0
          fi
          git commit -m "Record E002 checkpoint ${{ steps.determine.outputs.checkpoint }}"
          git push

      - name: Sync human-gate issues
        if: steps.preflight.outputs.run == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: orchestrator-human-gates

      - name: Upload checkpoint log
        if: always() && steps.preflight.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e002-checkpoint-${{ steps.determine.outputs.checkpoint }}
          path: e002-checkpoint.log
          if-no-files-found: ignore

      - name: Explain skipped checkpoint
        if: steps.determine.outputs.skip != 'true' && steps.preflight.outputs.run != 'true'
        run: |
          echo "Checkpoint was not run because the fail-closed preflight did not authorize it." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ steps.preflight.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
