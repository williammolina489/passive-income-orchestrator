name: Orchestrate Once

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: passive-income-orchestrator
  cancel-in-progress: false

jobs:
  run-one-task:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test current orchestrator checkout
        run: pytest -q

      - name: Verify portfolio before execution
        env:
          ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
        run: orchestrator-status --verify-remote --json

      - name: Refresh read-only operational observations
        env:
          ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
        run: |
          set -o pipefail
          orchestrator-monitor | tee operational-monitor.json

      - name: Decide and execute at most one bounded task
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
          ORCHESTRATOR_MODEL: gpt-5.6-luna
        run: |
          set -o pipefail
          orchestrator-run-once | tee orchestration-run.json

      - name: Generate post-execution portfolio status
        if: success()
        run: |
          set -o pipefail
          orchestrator-portfolio | tee portfolio-status.json
          cat PORTFOLIO_STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload orchestration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-run
          path: orchestration-run.json
          if-no-files-found: ignore

      - name: Commit task, result, and refreshed state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks results state observations PORTFOLIO_STATUS.md
          if git diff --cached --quiet; then
            echo "No orchestration state changes to commit."
            exit 0
          fi
          git commit -m "Record orchestrated worker result"
          git push

      - name: Sync human-gate issues
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: orchestrator-human-gates
