name: Orchestrate Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/orchestrate-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: passive-income-orchestrator
  cancel-in-progress: false

jobs:
  run-one-task:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify portfolio before execution
        env:
          ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
        run: orchestrator-status --verify-remote --json

      - name: Decide and execute at most one bounded task
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
          ORCHESTRATOR_MODEL: gpt-5.6-luna
        run: |
          set -o pipefail
          orchestrator-run-once | tee orchestration-run.json

      - name: Upload orchestration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-run
          path: orchestration-run.json
          if-no-files-found: ignore

      - name: Commit task, result, and refreshed state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks results state
          if git diff --cached --quiet; then
            echo "No orchestration state changes to commit."
            exit 0
          fi
          git commit -m "Record orchestrated worker result"
          git push
