version: 1

projects:
  crypto_funding_basis:
    repo: williammolina489/crypto-funding-basis-bot
    enabled: true
    role: research
    state_file: state/crypto_funding_basis.json
    worker:
      enabled: false
      reason: E002_DRAFT_NOT_AUTHORIZED_TO_RUN
    notes: >
      Manage only according to the repository's current experiment state,
      preregistration, gates, and documented constraints.

  kalshi_market_maker:
    repo: williammolina489/kalshi-market-maker-research
    enabled: true
    role: research
    state_file: state/kalshi_market_maker.json
    worker:
      enabled: false
      reason: EXACT_RECOVERY_WORKER_NOT_IMPLEMENTED
    notes: >
      Current work is exact-recovery only. Preserve the preregistered E001
      methodology and do not reconstruct missing prior source from memory.

  crypto_trading_bot:
    repo: williammolina489/crypto-trading-bot
    enabled: true
    role: paper_research
    state_file: state/crypto_trading_bot.json
    worker:
      enabled: false
      reason: EXISTING_REPO_SCHEDULERS_ALREADY_OWN_PAPER_EXECUTION
    monitor:
      enabled: true
      kind: github_actions_workflows
      max_age_minutes: 180
      workflows:
        - Forward paper BTC cycle
        - Forward challenger BTC basket
        - Forward paper health watch
        - Forward challenger health watch
    notes: >
      Observe the existing incumbent v3 and EXP-009 prospective paper evidence
      chains. Do not duplicate scheduled paper execution or alter frozen gates.

  alpaca_paper_trading_bot:
    repo: williammolina489/alpaca-paper-trading-bot
    enabled: true
    role: paper_research
    state_file: state/alpaca_paper_trading_bot.json
    worker:
      enabled: false
      reason: DEVELOPMENT_WORKER_NOT_YET_CONFIGURED
    code_worker:
      enabled: false
      reason: PILOT_MERGED_HEALTHY_AWAITING_NEXT_AUTHORIZED_JOB
      base_ref: main
      branch_prefix: orchestrator/
      setup_commands:
        - python -m pip install -r requirements.txt
        - python -m pip install -e .
      validation_commands:
        - pytest -q
      protected_paths:
        - .github/
        - PROJECT_STATE.md
        - EXPERIMENTS.md
        - ROADMAP.md
        - AUDIT_HANDOFF.md
        - CHATGPT_REVIEW_NOTES.md
        - .env
        - .env.example
    monitor:
      enabled: true
      kind: http_json
      url: https://alpaca-paper-trading-bot-production.up.railway.app/health
      required_equals:
        status: ok
        process: ok
        database: ok
        paper: true
        entries_disabled: false
        reconciliation_status: ok
      max_heartbeat_age_seconds: 300
      include_fields:
        - status
        - process
        - database
        - paper
        - service_status
        - entries_disabled
        - last_cycle_at
        - heartbeat_age_seconds
        - reconciliation_status
        - flatten_status
    notes: >
      Paper-only stock bot. Keep current strategy/risk settings frozen while
      monitoring and validation integration are built. Real-money trading remains prohibited.

  systematic_futures:
    repo: williammolina489/systematic-futures-bot
    enabled: false
    role: archived_research
    state_file: state/systematic_futures.json
    reason: PROJECT_CLOSED
    notes: >
      E003 ended STOP / REJECT and explicitly closed the futures project.
      Do not run VALIDATION, unseal OOS, retune E003, or propose E004.

  prediction_market_arbitrage:
    repo: williammolina489/prediction-market-arbitrage-scanner
    enabled: false
    role: archived_research
    state_file: state/prediction_market_arbitrage.json
    reason: PROJECT_CLOSED
    notes: >
      Closed as a strict prediction-market arbitrage research program.
      Do not restart, create E004, or convert it into relative-value,
      statistical-arbitrage, forecasting, or market-making research.
